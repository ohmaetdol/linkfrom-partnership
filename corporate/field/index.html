<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오토밀 B2B | 모바일 촬영 진행표</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4ed;color:#203738;font-family:system-ui,sans-serif;word-break:keep-all}header{background:#203738;color:white;padding:25px 20px;position:sticky;top:0;z-index:2}header small{color:#c7ee96;font-size:10px;letter-spacing:1px}h1{font-size:25px;line-height:1.35;margin:13px 0}header p{font-size:11px;color:#d6ddd2;line-height:1.7}.bar{background:#4c6158;height:5px;border-radius:5px}.bar i{display:block;height:5px;background:#c7ee96;width:0;transition:width .2s}main{padding:16px}nav{display:flex;gap:6px;overflow:auto;margin-bottom:16px}nav button{white-space:nowrap;background:white;border:1px solid #ccd6c1;border-radius:20px;padding:9px 12px;color:#203738}nav button.active{background:#203738;color:white}.panel{display:none}.panel.active{display:block}h2{font-size:18px}label{display:flex;gap:11px;background:white;padding:17px 14px;margin:9px 0;border-radius:9px;font-size:14px;line-height:1.7;border:1px solid #e0e5d8}input{width:22px;height:22px;flex-shrink:0;accent-color:#456c3b}label:has(input:checked){background:#e5efd8;color:#597449}small.note{display:block;font-size:10px;line-height:1.7;color:#667371;margin:16px 0}a{color:#456c3b}button{cursor:pointer}footer{font-size:10px;padding:15px 20px;color:#667371}strong{font-weight:600}</style></head><body><header><small>AUTOMILL B2B / FIELD GUIDE</small><h1>농장과 스테이<br>촬영 진행표</h1><p>집 → 농장 → 스테이 → 거래처 이야기<br>실제 기획서 초안 기반 · 현장에서 확인하며 사용</p><div class="bar"><i id="progress"></i></div><p id="count">0개 체크</p></header><main><nav><button class="active" data-tab="shots">필수 장면</button><button data-tab="questions">장소별 질문</button><button data-tab="facts">사전 확인</button></nav><section class="panel active" id="shots"><h2>놓치지 말아야 할 장면</h2><div id="shot-items"></div></section><section class="panel" id="questions"><h2>장소별 전체 질문 · 꼬리 질문</h2><div id="question-items"></div></section><section class="panel" id="facts"><h2>촬영 전 확인</h2><div id="fact-items"></div></section><small class="note">체크 상태는 이 기기의 브라우저에만 저장됩니다. 팀 공동 저장은 별도 연동이 필요합니다. 질문은 제작진 제안이며 출연자의 실제 대사가 아닙니다.</small><a href="https://stump-melon-010.notion.site/3f2adade1e7381679335f3c52739cb4f?source=copy_link" target="_blank" rel="noopener">전체 기획서 보기 ↗</a></main><footer>오토밀 B2B · 모바일 촬영 진행표</footer><script>const groups={shots:['집에서 실제 일하러 나가는 모습','인물과 농장 규모를 함께 보여주는 썸네일 사진','당일 농장 작업의 과정과 결과','출연자의 생활 방식이 드러나는 실제 행동','공간을 보고 질문이 생기는 순간과 답변','서울 생활과 내려온 계기의 구체적인 경험','첫 거래처에서 재주문까지 이어진 사례','스테이를 직접 만든 흔적·공사 전후 자료','현재 사업의 고민과 다음 행동'],questions:["집 — 서울을 떠난 이유 / 오늘은 어디부터 가세요?", "집 — 서울을 떠난 이유 / 서울에 계실 때도 이 시간에 하루를 시작하셨어요?", "집 — 서울을 떠난 이유 / 여기로 내려오기로 마음먹은 계기가 뭐였어요?", "집 — 서울을 떠난 이유 / 그때 몇 살이었어요?", "집 — 서울을 떠난 이유 / 처음부터 농사를 계속할 생각이었어요?", "집 — 서울을 떠난 이유 / 가족이 하던 일과 본인이 새로 시작한 일은 어떻게 달라요?", "농장 — 농부의 실제 하루 / 저쪽도 직접 관리하세요?", "농장 — 농부의 실제 하루 / 지금 뭘 보고 계신 거예요?", "농장 — 농부의 실제 하루 / 처음에는 어디까지 하셨어요?", "농장 — 농부의 실제 하루 / 이건 왜 빼시는 거예요?", "농장 — 농부의 실제 하루 / 좋은 모종은 뭘 보고 구분해요?", "농장 — 농부의 실제 하루 / 본인 농장에 쓸 모종을 키우다가 판매까지 하게 된 계기가 뭐예요?", "농장 — 농부의 실제 하루 / 가장 손이 많이 가는 일은요?", "농장 — 농부의 실제 하루 / 지난 한 시즌 기준 재배와 모종 매출이 각각 어느 정도였어요?", "농장 — 농부의 실제 하루 / 비용과 인건비를 빼면요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 여기도 직접 만드신 거예요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 처음엔 여기가 어떤 모습이었어요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 농장 하시다가 이 공간까지 만들고 싶었던 이유가 뭐예요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 가장 오래 걸린 부분은요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 그때 공사하던 사진이나 영상이 있어요?", "스테이 둘러보기 — 왜 숙소까지 만들었나 / 지금 청소·예약·관리는 누가 맡아요?", "거래처와 유통 — 처음 어떻게 팔았나 / 이건 어디로 나가요? / 과거 자료라면: 이때는 어디에 납품하셨어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 처음 딸기를 들고 찾아간 가게가 기억나요? 들어가서 뭐라고 하셨어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 처음 주문이 들어왔을 때 가격과 납품량은 어떻게 정했어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 한 번 사간 곳이 계속 주문하게 된 이유는 뭐였어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 샘플을 얼마나 들고 갔어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 거절한 곳도 있었어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 포장과 배송은 누가 했어요?", "거래처와 유통 — 처음 어떻게 팔았나 / 남거나 반품된 딸기는요?", "거래처와 유통 — 처음 어떻게 팔았나 / 직접 다 팔던 방식에서 지금은 무엇을 바꿨어요?", "스테이 대화 — 다음 사업의 선택 / 서울에 계실 때 이런 하루를 살게 될 거라고 생각하셨어요?", "스테이 대화 — 다음 사업의 선택 / 지금 하는 일 중 앞으로 가장 키우고 싶은 건 뭐예요?", "스테이 대화 — 다음 사업의 선택 / 그걸 키우는 데 지금 제일 부족한 건 뭐예요?", "스테이 대화 — 다음 사업의 선택 / 서울에서 내려왔던 때로 돌아간다면, 어떤 선택을 다르게 하겠어요?", "스테이 대화 — 다음 사업의 선택 / 농장을 더 넓히는 것과 유통을 키우는 것 중 왜 그쪽이에요?", "스테이 대화 — 다음 사업의 선택 / 직접 하던 일 중 누구에게 맡기고 싶어요?", "스테이 대화 — 다음 사업의 선택 / 착즙주스는 지금 어느 단계까지 왔어요?", "스테이 대화 — 다음 사업의 선택 / 귀농 전에 꼭 해보고 왔으면 하는 일이 있어요?", "스테이 대화 — 다음 사업의 선택 / 지금 가장 먼저 해결할 일 하나는 뭐예요?"],facts:['출연자 이름·촬영일 확인','귀농 당시 나이 확인','현재 운영 면적과 소유·임대 구분','당일 농장 작업 확인','거래처 방문·내부 촬영 가능 여부','공개 가능한 숫자와 과거 자료 확인']};const questionSections=[{"title": "집 — 서울을 떠난 이유", "start": 0, "note": "출근 준비·챙기는 도구·실제 이동을 따라간다. 서울 당시 직업과 나이를 확인한다."}, {"title": "농장 — 농부의 실제 하루", "start": 6, "note": "실제 경계·관리 인원을 확인한다. 당일 작업의 과정과 결과를 촬영한다. 매출과 순이익은 같은 기간의 근거를 확인한다."}, {"title": "스테이 둘러보기 — 왜 숙소까지 만들었나", "start": 15, "note": "직접 만든 부분·공사 전후 자료·당일 관리 작업을 확보한다."}, {"title": "거래처와 유통 — 처음 어떻게 팔았나", "start": 21, "note": "주문→포장→배송→재주문을 보여준다. 현재 납품이 없으면 과거 자료로 진행하고, 상호·내부 촬영 허용 여부를 확인한다."}, {"title": "스테이 대화 — 다음 사업의 선택", "start": 30, "note": "현재 성과와 앞으로의 구상을 구분한다. 실제 준비 자료를 보여주고 일상을 이어가는 모습으로 마무리한다."}];let saved={};try{saved=JSON.parse(localStorage.getItem('automill-field-farm-v2')||'{}')}catch{};for(const[g,items]of Object.entries(groups)){const dest=document.getElementById(g==='shots'?'shot-items':g==='questions'?'question-items':'fact-items');items.forEach((text,i)=>{if(g==='questions'){const part=questionSections.find(x=>x.start===i);if(part){const h=document.createElement('h2');h.textContent=part.title;const n=document.createElement('small');n.className='note';n.textContent=part.note;dest.append(h,n)}}const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=!!saved[g+i];input.onchange=()=>{saved[g+i]=input.checked;try{localStorage.setItem('automill-field-farm-v2',JSON.stringify(saved))}catch{}update()};label.append(input,document.createTextNode(text));dest.append(label)})}function update(){const all=[...document.querySelectorAll('input')],n=all.filter(x=>x.checked).length;document.querySelector('#count').textContent=n+' / '+all.length+'개 체크';document.querySelector('#progress').style.width=n/all.length*100+'%'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(e=>e.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});update()</script></body></html>

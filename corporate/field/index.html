<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오토밀 | 모바일 촬영 진행표</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f4ed;color:#203738;font-family:system-ui,sans-serif;word-break:keep-all}header{background:#203738;color:white;padding:25px 20px;position:sticky;top:0;z-index:2}header small{color:#c7ee96;font-size:10px;letter-spacing:1px}h1{font-size:25px;line-height:1.35;margin:13px 0}header p{font-size:11px;color:#d6ddd2;line-height:1.7}.bar{background:#4c6158;height:5px;border-radius:5px}.bar i{display:block;height:5px;background:#c7ee96;width:0;transition:width .2s}main{padding:16px}nav{display:flex;gap:6px;overflow:auto;margin-bottom:16px}nav button{white-space:nowrap;background:white;border:1px solid #ccd6c1;border-radius:20px;padding:9px 12px;color:#203738}nav button.active{background:#203738;color:white}.panel{display:none}.panel.active{display:block}h2{font-size:18px}label{display:flex;gap:11px;background:white;padding:17px 14px;margin:9px 0;border-radius:9px;font-size:14px;line-height:1.7;border:1px solid #e0e5d8}input{width:22px;height:22px;flex-shrink:0;accent-color:#456c3b}label:has(input:checked){background:#e5efd8;color:#597449}small.note{display:block;font-size:10px;line-height:1.7;color:#667371;margin:16px 0}a{color:#456c3b}button{cursor:pointer}footer{font-size:10px;padding:15px 20px;color:#667371}strong{font-weight:600}</style></head><body><header><small>AUTOMILL / FIELD GUIDE</small><h1>농장과 스테이<br>촬영 진행표</h1><p>집 → 농장 → 스테이 → 거래처 이야기<br>실제 기획서 초안 기반 · 현장에서 확인하며 사용</p><div class="bar"><i id="progress"></i></div><p id="count">0개 체크</p></header><main><nav><button class="active" data-tab="shots">필수 장면</button><button data-tab="questions">장소별 질문</button><button data-tab="facts">사전 확인</button></nav><section class="panel active" id="shots"><h2>놓치지 말아야 할 장면</h2><div id="shot-items"></div></section><section class="panel" id="questions"><h2>장소별 핵심 질문</h2><div id="question-items"></div></section><section class="panel" id="facts"><h2>촬영 전 확인</h2><div id="fact-items"></div></section><small class="note">체크 상태는 이 기기의 브라우저에만 저장됩니다. 팀 공동 저장은 별도 연동이 필요합니다. 질문은 제작진 제안이며 출연자의 실제 대사가 아닙니다.</small><a href="https://stump-melon-010.notion.site/3f2adade1e7381679335f3c52739cb4f?source=copy_link" target="_blank" rel="noopener">전체 기획서 보기 ↗</a></main><footer>오토밀 · 모바일 촬영 진행표 예시</footer><script>const groups={shots:['집에서 실제 일하러 나가는 모습','인물과 농장 규모를 함께 보여주는 썸네일 사진','당일 농장 작업의 과정과 결과','출연자의 생활 방식이 드러나는 실제 행동','공간을 보고 질문이 생기는 순간과 답변','서울 생활과 내려온 계기의 구체적인 경험','첫 거래처에서 재주문까지 이어진 사례','스테이를 직접 만든 흔적·공사 전후 자료','현재 사업의 고민과 다음 행동'],questions:['집 / 오늘은 어디부터 가세요?','집 / 여기로 내려오기로 마음먹은 계기가 뭐였어요?','농장 / 지금 뭘 보고 계신 거예요?','농장 / 처음에는 어디까지 하셨어요?','스테이 / 여기도 직접 만드신 거예요?','스테이 / 이 공간까지 만들고 싶었던 이유가 뭐예요?','거래처 / 처음 딸기를 들고 찾아간 가게가 기억나요?','거래처 / 한 번 사간 곳이 계속 주문하게 된 이유는 뭐였어요?','마무리 / 앞으로 가장 키우고 싶은 건 뭐예요?'],facts:['출연자 이름·촬영일 확인','귀농 당시 나이 확인','현재 운영 면적과 소유·임대 구분','당일 농장 작업 확인','거래처 방문·내부 촬영 가능 여부','공개 가능한 숫자와 과거 자료 확인']};let saved={};try{saved=JSON.parse(localStorage.getItem('automill-field-farm-v1')||'{}')}catch{};for(const[g,items]of Object.entries(groups)){const dest=document.getElementById(g==='shots'?'shot-items':g==='questions'?'question-items':'fact-items');items.forEach((text,i)=>{const label=document.createElement('label');const input=document.createElement('input');input.type='checkbox';input.checked=!!saved[g+i];input.onchange=()=>{saved[g+i]=input.checked;try{localStorage.setItem('automill-field-farm-v1',JSON.stringify(saved))}catch{}update()};label.append(input,document.createTextNode(text));dest.append(label)})}function update(){const all=[...document.querySelectorAll('input')],n=all.filter(x=>x.checked).length;document.querySelector('#count').textContent=n+' / '+all.length+'개 체크';document.querySelector('#progress').style.width=n/all.length*100+'%'}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab],.panel').forEach(e=>e.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});update()</script></body></html>
